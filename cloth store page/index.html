<!DOCTYPE html>
<html lang="en">
<head>
    <title>Clothing Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Clothing Store</h1>
        <nav>
            <ul>
                <li><button onclick="filterCategory('all')">All</button></li>
                <li><button onclick="filterCategory('shirts')">Shirts</button></li>
                <li><button onclick="filterCategory('pants')">Pants</button></li>
                <li><button onclick="filterCategory('accessories')">Accessories</button></li>
            </ul>
        </nav>
        <input type="text" id="search" placeholder="Search products..." onkeyup="searchProducts()">
    </header>
    <main>
        <section id="product-list">
            <div class="product" data-category="shirts" data-name="Cool Shirt">
                <img src="shirt.png" alt="Shirt" onclick="showDetails('T-Shirt', 'shirt.jpg', 'A cool shirt with vibrant colors.', '200.00 rs')">
                <h2>T-Shirt</h2>
                <p>200.00 rs</p>
            </div>
            <div class="product" data-category="pants" data-name="Comfortable Pants">
                <img src="pant.png" alt="Pants" onclick="showDetails('Cargo Pants', 'pants.jpg', 'Soft and comfortable pants for all day wear.', '300.00 rs')">
                <h2>Cargo Pants</h2>
                <p>300.00 rs</p>
            </div>
            <div class="product" data-category="accessories" data-name="Stylish Hat">
                <img src="hat.png" alt="Hat" onclick="showDetails('Stylish Hat', 'hat.jpg', 'A stylish hat to complete your look.', '150.00 rs')">
                <h2>Stylish Hat</h2>
                <p>150.00 rs</p>
            </div>
            <!-- Add more products as needed -->
        </section>
    </main>
    <footer>
        <p>&copy; Simple Clothing Store</p>
    </footer>

    <div id="product-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modal-title"></h2>
            <img id="modal-image" src="" alt="">
            <p id="modal-description"></p>
            <p id="modal-price"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
